apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-eval
  namespace: training
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: nightly-eval
              image: ghcr.io/YOUR_ORG/mealie-eval:latest
              args:
                - python
                - evaluate.py
              env:
                - name: MLFLOW_TRACKING_URI
                  value: http://mlflow-service.platform.svc.cluster.local:5000
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: minio-secret
                      key: accesskey
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-secret
                      key: secretkey
                - name: MLFLOW_S3_ENDPOINT_URL
                  value: http://minio-service.platform.svc.cluster.local:9000
              resources:
                requests:
                  cpu: "500m"
                  memory: "1Gi"
                limits:
                  cpu: "2"
                  memory: "2Gi"
